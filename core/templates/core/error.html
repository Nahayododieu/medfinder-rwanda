{% extends 'core/base.html' %}
{% block title %}{{ title }} · MedFinder Rwanda{% endblock %}
{% block content %}
<div class="narrow page" style="text-align:center">
  <p class="eyebrow" style="margin-top:30px">Error {{ status }}</p>
  <h1 style="margin:14px 0 8px;font-size:clamp(28px,5vw,40px);letter-spacing:-.04em">{{ title }}</h1>
  <p class="muted" style="max-width:460px;margin:0 auto 24px">{{ text }}</p>
  <p style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <a class="btn" href="{% url 'search' %}">Search for a medicine</a>
    <a class="btn btn-ghost" href="javascript:history.back()">Go back</a>
  </p>
</div>
{% endblock %}
